name: Bug report
description: Report a reproducible problem in the editor, CLI, parser, layout, or exports.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please avoid including confidential, personal, regulated, or proprietary diagram content.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal safe input and exact steps or commands.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node/npm versions, browser, and commit/tag.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Redact secrets and sensitive data before pasting logs.
